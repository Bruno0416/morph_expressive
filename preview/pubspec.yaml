name: morph_expressive_preview
description: Web-only component preview for the Morph Expressive package.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  gap: ^3.0.1
  material_ui: ^1.6.0
  morph_expressive:
    path: ../
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  # Lower bounds for transitive packages that the generator toolchain would
  # otherwise resolve to unusable versions in the lowest-resolution lane.
  # build_runner allows glob 2.0.x, which pins file 6.0.0; that release does
  # not compile against the current dart:io File.create(exclusive:) signature.
  file: ">=6.1.3 <8.0.0"
  # code_builder < 4.12.0 emits the generated Widgetbook directories file
  # without the blank line after the file-level ignore comment.
  code_builder: ^4.12.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
