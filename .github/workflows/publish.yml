name: Publication and release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Publish, confirm, tag and create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Prepare the exact package before requesting credentials
        run: |
          python3 tool/ci/check_final_release_language.py --revision HEAD
          dart pub publish --to-archive="$RUNNER_TEMP/release.tar.gz"
          python3 tool/ci/release_guard.py archive-files --archive "$RUNNER_TEMP/release.tar.gz"
      - name: Confirm metadata, SHA, registry, archive and existing release
        id: preflight
        run: python3 tool/ci/release.py plan --archive "$RUNNER_TEMP/release.tar.gz"
      - name: Require configured short-lived publisher identity
        if: steps.preflight.outputs.decision == 'publish'
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          PUBLISHER_SERVICE_ACCOUNT: ${{ vars.PUBLISH_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo 'WIF_PROVIDER is not configured.' >&2; exit 1; }
          test -n "$PUBLISHER_SERVICE_ACCOUNT" || { echo 'PUBLISH_SERVICE_ACCOUNT is not configured.' >&2; exit 1; }
      - name: Authenticate using GitHub OIDC federation
        if: steps.preflight.outputs.decision == 'publish'
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISH_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true
          create_credentials_file: false
      - name: Publish the validated version to pub.dev
        if: steps.preflight.outputs.decision == 'publish'
        env:
          PUB_DEV_TOKEN: ${{ steps.google-auth.outputs.id_token }}
        run: bash tool/ci/publish.sh
      - name: Confirm archive, then create immutable tag and GitHub Release
        if: steps.preflight.outputs.decision == 'publish' || steps.preflight.outputs.decision == 'recover'
        env:
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
        run: python3 tool/ci/release.py finalize --archive "$RUNNER_TEMP/release.tar.gz" --release-sha "$RELEASE_SHA"
