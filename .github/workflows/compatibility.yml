name: Dependency compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    name: Dependencies (${{ matrix.resolution }}), analysis, tests and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        resolution: [latest, lowest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Validate resolution in a disposable copy
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: bash tool/check_dependency_matrix.sh "$RESOLUTION"
