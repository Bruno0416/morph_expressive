name: Set up Flutter SDK
description: Install the same pinned Flutter SDK for every validation and release job.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.9'
        channel: stable
        cache: true
