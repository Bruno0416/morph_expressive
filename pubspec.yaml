name: morph_expressive
description: A Flutter design system that builds on Material 3 Expressive with a focus on symmetry, rounded shapes, balanced colors, and smooth animations.
version: 0.8.0
homepage: https://github.com/Bruno0416/morph_expressive
repository: https://github.com/Bruno0416/morph_expressive
issue_tracker: https://github.com/Bruno0416/morph_expressive/issues
documentation: https://github.com/Bruno0416/morph_expressive/blob/main/doc/README.md

topics:
  - flutter
  - material-design
  - material-3-expressive
  - design-system
  - animations

# A cross-platform Flutter widget library (not a native Flutter plugin).
# Confirm support with Flutter consumer builds before each release.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Ten animated screenshots for the pub.dev gallery (the README shows 14).
screenshots:
  - description: Controlled async button going from loading to success (animated check) and to error, in preserved-width and compact modes.
    path: doc/assets/gifs/async_button.gif
  - description: Skeleton placeholders sharing one tilted shimmer, then the real content appears without moving the layout.
    path: doc/assets/gifs/skeleton.gif
  - description: FAB sizes, the extended FAB and a FAB menu whose main surface morphs while the items open and close.
    path: doc/assets/gifs/fab_menu.gif
  - description: The five button styles with 90/160 ms press response and ShapeButtons with rotation and morph.
    path: doc/assets/gifs/buttons.gif
  - description: Segmented toggle, the connected button group and an automatically sized reactive group with a restrained neighbour response.
    path: doc/assets/gifs/segmented.gif
  - description: Tabs with a rounded underline and a pill surface whose indicator follows the page swipe.
    path: doc/assets/gifs/tabs.gif
  - description: Free and contained loaders with circular, circular wavy, linear and linear wavy progress.
    path: doc/assets/gifs/loading.gif
  - description: Morph navigation bars with elastic selection, plus the page indicators.
    path: doc/assets/gifs/navigation.gif
  - description: Dropdown menu opening, selecting and closing with the updated render and motion.
    path: doc/assets/gifs/dropdown.gif
  - description: List rows revealing and closing spring swipe actions.
    path: doc/assets/gifs/lists.gif

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dynamic_color: ^2.1.0
  fluent_icons_kit: ^0.1.2
  gap: ^3.0.1
  material_new_shapes: ^1.0.0
  material_ui: ^1.6.0
  motor: ^1.1.0

dev_dependencies:
  material_color_utilities: ^0.13.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/morph_shimmer.frag
    - shaders/morph_ellipse.frag
    - shaders/morph_rrect.frag
    - shaders/frosted_kawase_single_pass.frag
    - shaders/dropdown_liquid_unfold.frag
    - shaders/chip_organic.frag
    - shaders/date_range_reveal.frag
