name: morph_expressive
description: A Flutter design system that builds on Material 3 Expressive with a focus on symmetry, rounded shapes, balanced colors, and smooth animations.
version: 1.0.0
homepage: https://github.com/Bruno0416/morph_expressive
repository: https://github.com/Bruno0416/morph_expressive
issue_tracker: https://github.com/Bruno0416/morph_expressive/issues
documentation: https://github.com/Bruno0416/morph_expressive/blob/main/doc/README.md

topics:
  - flutter
  - material-design
  - material-3-expressive
  - design-system
  - animations

# A cross-platform Flutter widget library (not a native Flutter plugin).
# Confirm support with Flutter consumer builds before each release.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Ten animated screenshots for the pub.dev gallery.
screenshots:
  - description: Five button types, each shown with its press response, plus shape buttons that morph when pressed.
    path: doc/assets/gifs/buttons.gif
  - description: The five MorphVariant roles (primary, secondary, tertiary, muted, danger) across filled, tonal, outlined, text and icon buttons.
    path: doc/assets/gifs/variants.gif
  - description: Single-select and multi-select dropdown menus that open, highlight on hover, select an option and close.
    path: doc/assets/gifs/dropdown.gif
  - description: A linear slider, a wavy slider and a wavy range slider dragged by pointer.
    path: doc/assets/gifs/sliders.gif
  - description: Free and contained loading indicators, plus circular, circular wavy and linear progress.
    path: doc/assets/gifs/loading.gif
  - description: Two navigation bars changing destination on tap, with elastic selection.
    path: doc/assets/gifs/navigation.gif
  - description: One theme density switch (compact, standard, comfortable) resizing buttons, chips, a text field and list rows.
    path: doc/assets/gifs/density.gif
  - description: Desktop context menu opening at the pointer on secondary click, with row hover, a submenu and an action that closes it.
    path: doc/assets/gifs/context_menu.gif
  - description: Controlled async button going from loading to success (animated check) and to error, in preserved-width and compact modes.
    path: doc/assets/gifs/async_button.gif
  - description: FAB sizes, the extended FAB and a FAB menu whose main surface morphs while the items open and close.
    path: doc/assets/gifs/fab_menu.gif

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dynamic_color: ^2.1.0
  fluent_icons_kit: ^0.1.2
  gap: ^3.0.1
  material_new_shapes: ^1.0.0
  material_ui: ^1.6.0
  motor: ^1.1.0

dev_dependencies:
  material_color_utilities: ^0.13.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/morph_shimmer.frag
    - shaders/morph_ellipse.frag
    - shaders/morph_rrect.frag
    - shaders/frosted_kawase_single_pass.frag
    - shaders/dropdown_liquid_unfold.frag
    - shaders/chip_organic.frag
    - shaders/date_range_reveal.frag
